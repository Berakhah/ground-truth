# H12 / 00 security baseline (Task 52 item 5): schedule-only trigger, never
# pull_request_target -- a fork-submitted PR must never run this with repository secrets.
# This workflow does not hold, and must never be given, a model-provider API key: the live
# sweep that needs one runs locally, and only its redacted result (artifacts/regression.json)
# is committed for this workflow to read.
name: regression-watch
on:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
  issues: write
jobs:
  regression-watch:
    name: regression-watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open issues for any committed regression findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The logic lives in scripts/regression_issues.py so it is tested: placeholder data
        # opens nothing, and an issue already present (open or closed) is never opened twice.
        # Stdlib only, so no uv sync is needed. A finding naming a provider carries a
        # 10-business-day notice (spec 13.3); this opens the issue and stops.
        run: python3 scripts/regression_issues.py
