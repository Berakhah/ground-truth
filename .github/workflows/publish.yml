name: publish
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  gate:
    name: full Python gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: no float in the money path
        run: |
          targets=()
          for d in ground_truth/graders ground_truth/triage \
                   ground_truth/matrix/cost.py ground_truth/matrix/build.py; do
            [ -e "$d" ] && targets+=("$d")
          done
          if [ "${#targets[@]}" -gt 0 ] && grep -rn "float(" "${targets[@]}"; then
            echo "float() is forbidden in the money path"; exit 1
          fi
      - run: uv run pytest -v --cov=ground_truth --cov-report=term-missing --cov-fail-under=75
      - run: uv run pytest -m slow -v

  release:
    name: regenerate artifacts, verify reproduction, build the site
    needs: gate
    runs-on: ubuntu-latest
    # contents: write is needed only here, to create the tag's GitHub release and attach the
    # SBOM asset to it -- narrower than the workflow-default contents: read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv sync --all-extras
      - name: release gate, stage two (blocking)
        # Two-stage gate. The reproducibility and contamination gates need
        # data/results.duckdb, which carries private-split outputs and never leaves the machine
        # that cut the release, so they run there (`python -m ground_truth.publish.release`),
        # which writes artifacts/release.json only if they pass. Here, with no database:
        # refuse placeholder data, refuse any file those gates did not see or that changed
        # since, and recompute every headline from the published verdicts -- the same check a
        # stranger runs. A release that fails either stage must not reach the web.
        run: python scripts/reproduce.py artifacts/ --require-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci --prefix web
      - name: typecheck
        working-directory: web
        # `next typegen` writes the global LayoutProps/PageProps types tsc needs; on a clean
        # checkout nothing else has generated them yet.
        run: npx next typegen && npx tsc --noEmit
      - run: npm run build --prefix web
      - name: no test fixture routes in the published site
        # web/app/judge/*-example render synthetic numbers for Playwright only. They 404 unless
        # GT_E2E_FIXTURES=1, which this workflow never sets; this fails the release if one slips
        # into the export anyway. Fails closed: a missing web/out or a grep error (rc 2) also
        # fails.
        run: |
          test -d web/out || { echo "web/out missing"; exit 1; }
          rc=0
          grep -rl "data-gt-fixture" web/out || rc=$?
          if [ "$rc" -eq 0 ]; then echo "a fixture route reached web/out"; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "fixture scan failed (grep rc=$rc)"; exit 1; fi
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/out
      - name: generate CycloneDX SBOM for the Python dependency set
        # 00 SS8 / Task 52 item 3: a downstream consumer of a release should be able to audit
        # exactly what shipped without re-resolving the lockfile themselves.
        run: |
          uv export --frozen --no-hashes -o /tmp/requirements.txt
          uvx --from cyclonedx-bom cyclonedx-py requirements /tmp/requirements.txt \
            --output-format json --output-file sbom.cdx.json
      - name: attach the SBOM to this tag's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag || true
          gh release upload "${GITHUB_REF_NAME}" sbom.cdx.json --clobber

  deploy:
    name: deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
