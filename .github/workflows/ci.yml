name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: no float in the money path
        run: |
          # ground_truth/matrix is NOT listed whole: matrix/latency.py measures milliseconds,
          # not money, and float(np.percentile(...)) is correct there. Only the two
          # money-carrying files in that package are gated.
          targets=()
          for d in ground_truth/graders ground_truth/triage \
                   ground_truth/matrix/cost.py ground_truth/matrix/build.py; do
            [ -e "$d" ] && targets+=("$d")
          done
          if [ "${#targets[@]}" -gt 0 ] && grep -rn "float(" "${targets[@]}"; then
            echo "float() is forbidden in the money path"; exit 1
          fi
      - run: uv run pytest -v --cov=ground_truth --cov-report=term-missing --cov-fail-under=75
      - name: slow tests (coverage and null simulations)
        run: uv run pytest -m slow -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci --prefix web
      - run: npx --prefix web tsc --noEmit
      - run: npm run build --prefix web
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npx --prefix web playwright test

  dependency-audit:
    name: dependency scanning (00 SS8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
      - name: pip-audit (Python dependencies)
        # continue-on-error: this is a new gate (Task 52 item 3) surfacing findings for
        # triage; it is advisory, not blocking, until a first pass of findings has been
        # reviewed and either fixed or explicitly accepted. Flip to blocking once that
        # triage has happened -- see docs/security.md.
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci --prefix web
      - name: npm audit (web/ dependencies)
        continue-on-error: true
        run: npm audit --prefix web --audit-level=high
