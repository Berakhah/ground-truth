name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: no float in the money path
        run: |
          # ground_truth/matrix is NOT listed whole: matrix/latency.py measures milliseconds,
          # not money, and float(np.percentile(...)) is correct there. Only the two
          # money-carrying files in that package are gated.
          targets=()
          for d in ground_truth/graders ground_truth/triage \
                   ground_truth/matrix/cost.py ground_truth/matrix/build.py; do
            [ -e "$d" ] && targets+=("$d")
          done
          if [ "${#targets[@]}" -gt 0 ] && grep -rn "float(" "${targets[@]}"; then
            echo "float() is forbidden in the money path"; exit 1
          fi
      - run: uv run pytest -v --cov=ground_truth --cov-report=term-missing --cov-fail-under=75
      - name: slow tests (coverage and null simulations)
        run: uv run pytest -m slow -v
