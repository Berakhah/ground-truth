# docker-compose.yml
#
# Ground Truth Phase 1 has no external services (00-SHARED-FOUNDATION.md
# R5): DuckDB is an embedded local .duckdb file, not a server, and the
# provider gateway is shimmed (no real network calls in Phase 1). One
# service, no postgres / litellm-proxy / prometheus -- those belong to
# other projects in this portfolio, not this one.
#
# `docker compose up` runs the test suite as the smoke test proving a
# fresh machine's setup works with no manual steps beyond copying
# .env.example to .env. For the actual CLI commands (build the golden
# set, render a triage report), see README.md.
services:
  app:
    build: .
    env_file:
      - .env
